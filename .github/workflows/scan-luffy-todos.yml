name: scan-luffy-todos-once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HexaGnatShaft/LUFFY
          ref: dev
          fetch-depth: 0
          path: target
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan every tracked Python file and verify README delta
        shell: bash
        run: python3 "${GITHUB_WORKSPACE}/.github/scripts/scan_luffy_todos.py" "${GITHUB_WORKSPACE}/target"
