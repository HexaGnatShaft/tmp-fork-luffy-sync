name: one-time-luffy-readme-sync
on:
  workflow_dispatch:
    inputs:
      target_token:
        description: Write token for HexaGnatShaft/LUFFY
        required: true
        type: string
      dry_run:
        description: Validate without pushing
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN: ${{ inputs.target_token }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify main-to-dev TODO delta and update README on dev
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${TOKEN}"
          TARGET="HexaGnatShaft/LUFFY"
          EXPECTED_URL="https://github.com/baiduxhs/LUFFY-todo-sync.git"
          BR="dev"
          OLD="7463fefd0f55ae2ba0b919e06527588022893495"
          EXPSHA="7dc17f510d763636dde20b22c6a147edff20cdcc"
          WORK="${GITHUB_WORKSPACE}/luffy-target"
          rm -rf "${WORK}"
          git clone --no-checkout "https://github.com/${TARGET}.git" "${WORK}"
          cd "${WORK}"
          git fetch --no-tags origin "${BR}:refs/remotes/origin/${BR}" main:refs/remotes/origin/main
          test "$(git rev-parse "origin/${BR}")" = "${OLD}"
          test "$(git rev-parse origin/main)" = "266cbc22215201a93c02e37200fe32be98a9e931"
          test "$(git diff --name-only origin/main...origin/${BR} | sort | tr '\n' ' ')" = "luffy/deepscaler/utils.py luffy/verl/verl/protocol.py "
          git fetch --no-tags "${EXPECTED_URL}" "dev:refs/remotes/expected/dev"
          test "$(git rev-parse refs/remotes/expected/dev)" = "${EXPSHA}"
          test "$(git rev-parse "${EXPSHA}^")" = "${OLD}"
          test "$(git diff --name-only "${OLD}" "${EXPSHA}" | tr '\n' ' ')" = "README.md "
          git checkout -q "${OLD}"
          cp README.md /tmp/old_README.md
          git show "${EXPSHA}:README.md" > /tmp/new_README.md
          python3 "${GITHUB_WORKSPACE}/.github/scripts/validate_readme_sync.py" /tmp/old_README.md /tmp/new_README.md "${WORK}"
          cp /tmp/new_README.md README.md
          git add README.md
          git -c user.name="HexaGnatShaft" -c user.email="316013557+HexaGnatShaft@users.noreply.github.com" commit -m "docs: sync README Complete TODO List with dev implementation" -m "Remove 11 implemented TODOs and update shifted line numbers; preserve title, ordering, and format."
          NEW="$(git rev-parse HEAD)"
          BLOB="$(git rev-parse HEAD:README.md)"
          EXPECTED_BLOB="$(git rev-parse "${EXPSHA}:README.md")"
          test "${BLOB}" = "${EXPECTED_BLOB}"
          echo "Prepared commit ${NEW}; README blob ${BLOB}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run successful; refusing to push."
            exit 0
          fi
          B64="$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${B64}"
          git push origin "HEAD:refs/heads/${BR}"
          git ls-remote origin "refs/heads/${BR}" | grep "${NEW}"
          echo "Pushed ${NEW} to ${TARGET}:${BR}"
